# Expõe o próprio Argo CD (exige server.insecure=true no argocd-cmd-params-cm)
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  parentRefs:
    - name: lan
      namespace: envoy-gateway-system
  hostnames: [argocd.lan]
  rules:
    - backendRefs:
        - name: argocd-server
          port: 80
