# DNS dedicado aos domínios *.lan: responde com o IP do Gateway (Envoy) e
# encaminha o resto para a internet. Separado do CoreDNS do kube-system.
apiVersion: v1
kind: Namespace
metadata:
  name: lan-dns
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: lan-dns
  namespace: lan-dns
data:
  Corefile: |
    lan:53 {
        errors
        log
        template IN A lan {
            answer "{{ .Name }} 60 IN A 192.168.3.241"
        }
        template IN AAAA lan {
            rcode NOERROR
        }
    }
    .:53 {
        errors
        cache 30
        forward . 1.1.1.1 8.8.8.8
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lan-dns
  namespace: lan-dns
spec:
  replicas: 2
  selector:
    matchLabels:
      app: lan-dns
  template:
    metadata:
      labels:
        app: lan-dns
    spec:
      containers:
        - name: coredns
          image: coredns/coredns:1.12.0
          args: ["-conf", "/etc/coredns/Corefile"]
          ports:
            - containerPort: 53
              protocol: UDP
            - containerPort: 53
              protocol: TCP
          volumeMounts:
            - name: cfg
              mountPath: /etc/coredns
      volumes:
        - name: cfg
          configMap:
            name: lan-dns
---
apiVersion: v1
kind: Service
metadata:
  name: lan-dns
  namespace: lan-dns
  annotations:
    metallb.io/loadBalancerIPs: 192.168.3.240
spec:
  type: LoadBalancer
  selector:
    app: lan-dns
  ports:
    - name: dns-udp
      port: 53
      protocol: UDP
    - name: dns-tcp
      port: 53
      protocol: TCP
