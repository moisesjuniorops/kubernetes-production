# Um Application por pasta em platform/ (metallb, envoy-gateway, coredns...)
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: platform
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: https://github.com/moisesjuniorops/kubernetes-production
        revision: main
        directories:
          - path: platform/*
  template:
    metadata:
      name: "platform-{{ .path.basename }}"
    spec:
      project: default
      source:
        repoURL: https://github.com/moisesjuniorops/kubernetes-production
        targetRevision: main
        path: "{{ .path.path }}"
      destination:
        server: https://kubernetes.default.svc
      syncPolicy:
        automated: { prune: true, selfHeal: true }
        syncOptions: [ServerSideApply=true]
        retry:
          limit: 5
          backoff: { duration: 15s, factor: 2, maxDuration: 3m }
