{{- if .Values.route.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Release.Name }}
  labels: {{- include "webapp.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.route.gateway.name }}
      namespace: {{ .Values.route.gateway.namespace }}
  hostnames: {{- toYaml (required "route.hostnames é obrigatório" .Values.route.hostnames) | nindent 4 }}
  rules:
    - backendRefs:
        - name: {{ .Release.Name }}
          port: {{ .Values.port }}
{{- end }}
