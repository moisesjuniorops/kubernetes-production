# Único apply manual:  kubectl apply -f bootstrap/root-app.yaml
# Ele faz o Argo CD gerenciar tudo que está em argocd/ (os ApplicationSets).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/moisesjuniorops/kubernetes-production
    targetRevision: main
    path: argocd
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated: { prune: true, selfHeal: true }
